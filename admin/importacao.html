<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Painel de Importação</title>
<style>body{font-family:Arial;background:#0f172a;color:white;padding:25px}.box{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}button{padding:10px;background:#22c55e;border:0;color:white;border-radius:8px;cursor:pointer}.danger{background:#ef4444}table{width:100%;background:#111827}td,th{padding:8px}</style></head>
<body>
<h1>🚁 Administração de Importações</h1>
<div class="box">
<input id="file" type="file" accept=".json,.kml,.csv"><br><br>
<div id="info">Nenhum arquivo selecionado</div><br>
<button onclick="visualizar()">Ver Prévia</button> <button onclick="importar()">Importar para Banco</button>
<progress id="bar" value="0" max="100" style="width:100%"></progress>
<table id="preview"></table><pre id="log"></pre>
</div>
<div class="box"><h2>Histórico</h2><table id="hist"></table></div>
<script>
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
file.onchange=()=>{let f=file.files[0];info.textContent=f?`Arquivo: ${f.name} (${(f.size/1024).toFixed(1)} KB)`:''};

async function visualizar(){let f=file.files[0];if(!f)return;let t=await f.text();let r=await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:f.name,conteudo:t})});let j=await r.json();log.textContent='Prévia antes da importação:\n'+JSON.stringify(j,null,2);
if(j.voos){preview.innerHTML='<tr><th>Arquivo</th><th>Drone</th><th>Pontos</th><th>Área</th></tr>'+j.voos.map(v=>`<tr><td>${escapeHtml(v.arquivo)}</td><td>${escapeHtml(v.drone)}</td><td>${v.pontos}</td><td>${v.area}</td></tr>`).join('')} }

async function importar(){let f=file.files[0];if(!f)return alert('Selecione um arquivo');bar.value=20;try{let text=await f.text();let d;try{d=JSON.parse(text)}catch(e){d={arquivo:f.name,conteudo:text}}bar.value=50;let r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();bar.value=80;await fetch('/api/importacoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({arquivo:f.name,registros:j.imported||0,status:j.success?'Concluído':'Erro'})});bar.value=100;log.textContent=JSON.stringify(j,null,2);carregar()}catch(e){log.textContent=e.message;bar.value=0}}
async function excluir(id){if(!confirm('Excluir esta importação?'))return;await fetch('/api/importacoes?id='+id,{method:'DELETE'});carregar()}
async function carregar(){let r=await fetch('/api/importacoes');let d=await r.json();hist.innerHTML='<tr><th>Arquivo</th><th>Registros</th><th>Status</th><th>Ação</th></tr>'+d.map(x=>`<tr><td>${escapeHtml(x.arquivo)}</td><td>${x.registros}</td><td>${escapeHtml(x.status)}</td><td><button class="danger" onclick="excluir(${x.id})">Excluir</button></td></tr>`).join('')};carregar();
</script></body></html>
