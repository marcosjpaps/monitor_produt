<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Operacional • AgroTelemetry Multi-Máquinas</title>
  
  <!-- Lucide Icons -->
  <script src="/static/vendor/lucide.min.js"></script>

  <style>
    :root {
      --bg-dark: #070b12;
      --bg-panel: #0d1522;
      --bg-card: #131d2e;
      --bg-card-hover: #1a273e;
      --border: #23354d;
      --border-hover: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      --jd-green: #367c2b;
      --jd-yellow: #ffde00;
      --jacto-orange: #ea580c;
      --jacto-orange-glow: rgba(234, 88, 12, 0.4);
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #111d33 0%, #070b12 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* TOP BAR */
    .top-bar {
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(13, 21, 34, 0.8);
      backdrop-filter: blur(12px);
    }

    .brand-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-top-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #070b12;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .brand-top-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-top-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .sys-badges {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    .badge-status .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* MAIN CONTAINER */
    .portal-container {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 36px;
    }

    .hero-title {
      text-align: center;
      max-width: 720px;
    }

    .hero-title h2 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-title p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* CARDS GRID (4 COLUMNS ON DESKTOP) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      width: 100%;
    }

    /* CARD STYLES */
    .machine-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .machine-card:hover {
      transform: translateY(-6px);
      background: var(--bg-card-hover);
    }

    /* JOHN DEERE THEME */
    .card-jd:hover {
      border-color: var(--jd-yellow);
      box-shadow: 0 12px 35px rgba(54, 124, 43, 0.35);
    }

    .card-jd .card-header-icon {
      background: linear-gradient(135deg, #1b4d13 0%, #367c2b 70%, #ffde00 100%);
      box-shadow: 0 6px 18px rgba(54, 124, 43, 0.4);
      border: 1px solid rgba(255, 222, 0, 0.4);
      color: #ffffff;
    }

    .card-jd .badge-brand {
      background: rgba(54, 124, 43, 0.2);
      border: 1px solid rgba(255, 222, 0, 0.5);
      color: #ffde00;
    }

    .card-jd .btn-enter {
      background: linear-gradient(135deg, #367c2b, #285e20);
      color: #ffde00;
      border: 1px solid rgba(255, 222, 0, 0.4);
    }

    .card-jd .btn-enter:hover {
      background: linear-gradient(135deg, #449a37, #367c2b);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(54, 124, 43, 0.5);
    }

    /* JACTO THEME */
    .card-jacto:hover {
      border-color: #f97316;
      box-shadow: 0 12px 35px var(--jacto-orange-glow);
    }

    .card-jacto .card-header-icon {
      background: linear-gradient(135deg, #9a3412 0%, #ea580c 70%, #fb923c 100%);
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.4);
      border: 1px solid rgba(251, 146, 60, 0.4);
      color: #ffffff;
    }

    .card-jacto .badge-brand {
      background: rgba(234, 88, 12, 0.2);
      border: 1px solid rgba(251, 146, 60, 0.5);
      color: #fb923c;
    }

    .card-jacto .btn-enter {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #ffffff;
      border: 1px solid rgba(251, 146, 60, 0.4);
    }

    .card-jacto .btn-enter:hover {
      background: linear-gradient(135deg, #f97316, #ea580c);
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.5);
    }


    /* STUDIO THEME */
    .card-studio:hover {
      border-color: #a855f7;
      box-shadow: 0 12px 35px rgba(168, 85, 247, 0.35);
    }

    .card-studio .card-header-icon {
      background: linear-gradient(135deg, #6b21a8 0%, #9333ea 70%, #c084fc 100%);
      box-shadow: 0 6px 18px rgba(168, 85, 247, 0.4);
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: #ffffff;
    }

    .card-studio .badge-brand {
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(192, 132, 252, 0.5);
      color: #c084fc;
    }

    .card-studio .btn-enter {
      background: linear-gradient(135deg, #9333ea, #7e22ce);
      color: #ffffff;
      border: 1px solid rgba(192, 132, 252, 0.4);
    }

    .card-studio .btn-enter:hover {
      background: linear-gradient(135deg, #a855f7, #9333ea);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }

    /* MASSEY FERGUSON THEME */
    .card-massey:hover {
      border-color: #ef4444;
      box-shadow: 0 12px 35px rgba(220, 38, 38, 0.4);
    }

    .card-massey .card-header-icon {
      background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 70%, #f87171 100%);
      box-shadow: 0 6px 18px rgba(220, 38, 38, 0.45);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #ffffff;
    }

    .card-massey .badge-brand {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #f87171;
    }

    .card-massey .btn-enter {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #ffffff;
      border: 1px solid rgba(248, 113, 113, 0.4);
    }

    .card-massey .btn-enter:hover {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.55);
    }


    /* CARD HEADER */
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .card-header-icon {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge-brand {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-title h3 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .card-title p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* SPECS LIST */
    .specs-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
      font-size: 0.85rem;
    }

    .specs-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #cbd5e1;
    }

    .specs-list li i {
      color: var(--accent-cyan);
      flex-shrink: 0;
    }

    .specs-list li strong {
      color: #ffffff;
    }

    /* CARD BUTTON */
    .btn-enter {
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    /* FOOTER BAR */
    .footer-stats {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 18px 24px;
      background: rgba(13, 21, 34, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 16px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill strong {
      color: #ffffff;
    }
  </style>
  <link rel="stylesheet" href="/css/refinements.css">
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginOverlay" style="position:fixed; top:0; left:0; right:0; bottom:0; background:linear-gradient(135deg, #090e17 0%, #0d1522 50%, #06101e 100%); z-index:99999; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#131d2e; border:1px solid rgba(56,189,248,0.25); border-radius:16px; width:100%; max-width:400px; padding:32px 28px; box-shadow:0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(56,189,248,0.1); text-align:center;">
      <div style="width:60px; height:60px; background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.3); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; color:#38bdf8;">
        <i data-lucide="shield-check" style="width:30px; height:30px;"></i>
      </div>
      
      <h2 style="font-size:1.35rem; color:#f8fafc; font-weight:700; margin-bottom:4px;">Monitor Agrícola</h2>
      <p style="font-size:0.8rem; color:#94a3b8; margin-bottom:24px;">Controle de Operações & Telemetria</p>

      <form id="loginForm" onsubmit="handleLogin(event)" style="text-align:left;">
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:0.72rem; color:#94a3b8; margin-bottom:6px; font-weight:600; text-transform:uppercase;">E-mail de Acesso</label>
          <div style="position:relative;">
            <i data-lucide="mail" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:#64748b;"></i>
            <input type="email" id="txtEmail" required placeholder="seu@email.com" style="width:100%; background:#090e17; border:1px solid #334155; border-radius:8px; padding:10px 12px 10px 36px; color:#f8fafc; font-size:0.85rem; outline:none; transition:border-color 0.2s;">
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <label style="display:block; font-size:0.72rem; color:#94a3b8; margin-bottom:6px; font-weight:600; text-transform:uppercase;">Senha</label>
          <div style="position:relative;">
            <i data-lucide="lock" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:#64748b;"></i>
            <input type="password" id="txtPassword" required placeholder="••••••••" style="width:100%; background:#090e17; border:1px solid #334155; border-radius:8px; padding:10px 36px 10px 36px; color:#f8fafc; font-size:0.85rem; outline:none; transition:border-color 0.2s;">
            <button type="button" onclick="togglePasswordVisibility()" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:#64748b; cursor:pointer; padding:4px; display:flex; align-items:center;">
              <i id="eyeIcon" data-lucide="eye" style="width:16px; height:16px;"></i>
            </button>
          </div>
        </div>

        <div id="loginError" style="display:none; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; padding:8px 12px; border-radius:8px; font-size:0.78rem; margin-bottom:16px; text-align:center;">
          E-mail ou senha incorretos.
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:0.75rem; color:#94a3b8;">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" id="chkRemember" checked style="accent-color:#0284c7;">
            <span>Lembrar meu acesso</span>
          </label>
        </div>

        <button type="submit" id="btnLoginSubmit" style="width:100%; background:linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color:white; border:none; padding:11px; border-radius:8px; font-size:0.9rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 15px rgba(2,132,199,0.35);">
          <i data-lucide="log-in" style="width:18px; height:18px;"></i>
          <span>Entrar no Sistema</span>
        </button>
      </form>
      
      <div style="margin-top:22px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.06); font-size:0.72rem; color:#64748b;">
        AgroTelemetry • Acesso Restrito & Seguro
      </div>
    </div>
  </div>

  <script>
    // Autenticação validada no servidor. Nenhuma senha ou sessão é confiada ao localStorage.
    function showLoggedIn(email) {
      const overlay = document.getElementById('loginOverlay');
      const userBadge = document.getElementById('userBadgeContainer');
      const userEmail = document.getElementById('userBadgeEmail');
      if (overlay) overlay.style.display = 'none';
      if (userBadge) userBadge.style.display = 'flex';
      if (userEmail) userEmail.textContent = email;
      // Dashboard inspirado no Drone é a tela inicial após autenticação.
      const urlParams = new URLSearchParams(window.location.search);
      {
        const next = urlParams.get('next');
        const pages = ['/painel', '/importacoes'];
        window.location.replace(pages.includes(next) ? next : '/painel');
      }
    }

    function showLogin() {
      const overlay = document.getElementById('loginOverlay');
      const userBadge = document.getElementById('userBadgeContainer');
      if (overlay) overlay.style.display = 'flex';
      if (userBadge) userBadge.style.display = 'none';
      const el = document.getElementById('txtEmail');
      if (el) el.focus();
    }

    async function checkAuth() {
      // Exclui dados antigos que nunca foram um login seguro.
      for (const store of [localStorage, sessionStorage]) {
        store.removeItem('agromonitor_auth');
        store.removeItem('agromonitor_user');
      }
      try {
        const response = await fetch('/api/auth/me', { credentials: 'same-origin', cache: 'no-store' });
        if (!response.ok) throw new Error('Sessão não autorizada');
        const data = await response.json();
        if (!data.authenticated) throw new Error('Sessão não autorizada');
        showLoggedIn(data.email);
      } catch {
        showLogin();
      }
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('txtEmail');
      const pass = document.getElementById('txtPassword');
      const button = document.getElementById('btnLoginSubmit');
      const email = input.value.trim().toLowerCase();
      const password = pass.value;
      const remember = document.getElementById('chkRemember').checked;
      const errorBox = document.getElementById('loginError');
      if (errorBox) errorBox.style.display = 'none';
      if (button) button.disabled = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, remember }),
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Não foi possível entrar. Tente novamente.');
        }
        pass.value = '';
        showLoggedIn(data.email);
      } catch (err) {
        if (errorBox) {
          errorBox.style.display = 'block';
          errorBox.textContent = err.message || 'Erro ao entrar no sistema.';
        }
      } finally {
        if (button) button.disabled = false;
      }
    }

    async function logout() {
      if (!confirm('Deseja realmente sair do sistema?')) return;
      try {
        const response = await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        if (!response.ok) throw new Error('Falha ao sair');
        showLogin();
        const pass = document.getElementById('txtPassword');
        if (pass) pass.value = '';
      } catch {
        alert('Não foi possível encerrar a sessão. Tente novamente.');
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('txtPassword');
      const eye = document.getElementById('eyeIcon');
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (eye) eye.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        if (eye) eye.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    async function checkBackendHealth() {
      const label = document.getElementById('backendStatusText');
      if (!label) return;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch('/api/health', { cache: 'no-store', signal: controller.signal });
        if (!response.ok) throw new Error('Serviço indisponível');
        const data = await response.json();
        if (data.status !== 'ok') throw new Error('Serviço indisponível');
        label.textContent = 'API operacional';
        label.parentElement.classList.remove('offline');
      } catch {
        label.textContent = 'API indisponível — importações podem falhar';
        label.parentElement.classList.add('offline');
      } finally {
        clearTimeout(timeout);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      checkBackendHealth();
      lucide.createIcons();
    });
  </script>
</body>
</html>
