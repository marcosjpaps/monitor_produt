name: Monitor Agrícola - verificações de segurança

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/importacoes-persistentes-20261015]

permissions:
  contents: read

jobs:
  autenticacao-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: node --test tests/auth.test.js
      - run: node --test tests/painel-drone.test.js

  autenticacao-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'fastapi>=0.111.0' 'psycopg2-binary>=2.9.9'
      - run: python -m compileall -q backend
      - run: python -m unittest discover -s tests -p 'test_auth.py'
      - run: python -m unittest discover -s tests -p 'test_import_store.py'
