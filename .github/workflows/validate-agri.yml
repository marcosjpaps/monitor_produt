name: Validacao de Importacao Agricola
on:
  push:
    branches: [feature/visual-drone-multimaquinas-20261015]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node --check frontend/js/validar-upload.js
      - run: node --check frontend/js/painel.js
      - run: python -m compileall -q backend
      - run: python -m unittest discover -s tests -p 'test_agri_validator.py'
