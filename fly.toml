app = "agro-monitor"
primary_region = "gru" # São Paulo, Brasil (pode alterar se quiser)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  START_PYTHON = "true"
  DB_PATH = "/data/database.sqlite"
  TELEMETRY_DB_PATH = "/data/telemetria.db"

[mounts]
  source = "agro_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

